model:
  target_model_path: "Qwen/Qwen3-VL-32B-Instruct-FP8"
  draft_model_config: "configs/qwen3-vl-32b-instruct-dflash.json"
  target_backend: "sglang"
  input_modality: "qwen3_vl"
  embedding_key: "model.language_model.embed_tokens.weight"
  torch_dtype: "bfloat16"
  trust_remote_code: true
  sglang_mem_fraction_static: 0.5
  sglang_max_running_requests: 32

data:
  # Replace this file with your OpenAI-style conversation dataset.
  # Image URLs or absolute paths must be reachable from both SpecForge and SGLang.
  train_data_path: "./cache/dataset/qwen3-vl-32b-instruct-vlm-smoke.jsonl"
  max_length: 262137
  chat_template: "qwen3-instruct"
  build_dataset_num_proc: 8
  cache_dir: "./cache"
  min_pixels: 65536
  max_pixels: 16777216

training:
  strategy: "dflash"
  num_epochs: 4
  batch_size: 1
  accumulation_steps: 1
  learning_rate: 0.0006
  warmup_ratio: 0.04
  max_grad_norm: 1
  attention_backend: "flex_attention"
  num_anchors: 512
  objective_chunk_blocks: 128
  loss_decay_gamma: 7
  save_interval: 50000
  log_interval: 50
  dist_timeout: 120
  seed: 42

runtime:
  producer_lease: 5
  producer_concurrency: 2
  in_flight_high_watermark: 256
  in_flight_low_watermark: 128

tracking:
  report_to: "tensorboard"

run_id: "qwen3-vl-32b-instruct-fp8-dflash-3server-dp5-disaggregated"
output_dir: "./outputs/qwen3-vl-32b-instruct-fp8-dflash-3server-dp5-disaggregated"

deployment:
  mode: "disaggregated"
  trainer:
    nnodes: 1
    nproc_per_node: 5
  disaggregated:
    control_dir: "./outputs/qwen3-vl-32b-instruct-fp8-dflash-3server-dp5-disaggregated/control"
    backend: "mooncake"
    managed_local:
      trainer_cuda_visible_devices:
        - "3"
        - "4"
        - "5"
        - "6"
        - "7"
      mooncake:
        protocol: "tcp"
        global_segment_size_bytes: 103079215104
        local_buffer_size_bytes: 1073741824
        startup_timeout_s: 120
      capture_servers:
        - port: 30000
          cuda_visible_devices:
            - "0"
          tp_size: 1
          mem_fraction_static: 0.5
          startup_timeout_s: 10800
        - port: 30001
          cuda_visible_devices:
            - "1"
          tp_size: 1
          mem_fraction_static: 0.5
          startup_timeout_s: 10800
        - port: 30002
          cuda_visible_devices:
            - "2"
          tp_size: 1
          mem_fraction_static: 0.5
          startup_timeout_s: 10800
