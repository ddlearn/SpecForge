# Single-node 8-GPU run:
#   GPU 0-1: one Qwen3-VL-32B-Instruct-FP8 SGLang capture server (TP=2)
#   GPU 2-7: six data-parallel DFlash trainer ranks
model:
  target_model_path: "Qwen/Qwen3-VL-32B-Instruct-FP8"
  draft_model_config: "configs/qwen3-vl-32b-instruct-dflash.json"
  target_backend: "sglang"
  input_modality: "qwen3_vl"
  embedding_key: "model.language_model.embed_tokens.weight"
  torch_dtype: "bfloat16"
  trust_remote_code: true
  sglang_mem_fraction_static: 0.5
  sglang_max_running_requests: 8

data:
  # Replace this file with your image-only OpenAI-style conversation dataset.
  # Image URLs or absolute paths must be reachable from both SpecForge and SGLang.
  train_data_path: "./cache/dataset/qwen3-vl-32b-instruct-vlm-smoke.jsonl"
  max_length: 262144
  chat_template: "qwen3-instruct"
  build_dataset_num_proc: 8
  cache_dir: "./cache"
  min_pixels: 65536
  max_pixels: 16777216

training:
  strategy: "dflash"
  num_epochs: 6
  batch_size: 1
  accumulation_steps: 1
  learning_rate: 0.0006
  warmup_ratio: 0.04
  max_grad_norm: 1
  attention_backend: "flex_attention"
  num_anchors: 512
  objective_chunk_blocks: 128
  loss_decay_gamma: 7
  save_interval: 50000
  log_interval: 50
  dist_timeout: 120
  seed: 42

runtime:
  producer_lease: 8
  in_flight_high_watermark: 64
  in_flight_low_watermark: 48

tracking:
  report_to: "tensorboard"

run_id: "qwen3-vl-32b-instruct-fp8-dflash-1server-dp6-disaggregated"
output_dir: "./outputs/qwen3-vl-32b-instruct-fp8-dflash-1server-dp6-disaggregated"

deployment:
  mode: "disaggregated"
  trainer:
    nnodes: 1
    nproc_per_node: 6
  disaggregated:
    control_dir: "./outputs/qwen3-vl-32b-instruct-fp8-dflash-1server-dp6-disaggregated/control"
    backend: "mooncake"
    managed_local:
      trainer_cuda_visible_devices:
        - "2"
        - "3"
        - "4"
        - "5"
        - "6"
        - "7"
      mooncake:
        protocol: "tcp"
        global_segment_size_bytes: 34359738368
        local_buffer_size_bytes: 1073741824
        startup_timeout_s: 120
      capture_servers:
        - port: 30000
          cuda_visible_devices:
            - "0"
            - "1"
          tp_size: 2
          mem_fraction_static: 0.5
          startup_timeout_s: 1800
